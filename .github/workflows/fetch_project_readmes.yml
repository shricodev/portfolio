name: Sync showcase project READMEs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Sync repository metadata and README content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: shricodev
          TARGET_FOLDER: './content/projects'
        run: |
          set -euo pipefail
          mkdir -p "$TARGET_FOLDER"

          repos=$(gh api --method GET --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "/users/$TARGET_USER/repos?per_page=100" \
            | jq -r '.[][] | select(.private == false and .fork == false and (.topics | index("showcase") != null)) | .name' \
            | sort -u)

          expected_files=$(mktemp)
          trap 'rm -f "$expected_files"' EXIT

          for repo in $repos; do
            readme_file="$TARGET_FOLDER/${repo}_README.mdx"
            printf '%s\n' "$readme_file" >> "$expected_files"

            repo_metadata=$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$TARGET_USER/$repo")
            if ! readme_content=$(gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "/repos/$TARGET_USER/$repo/readme"); then
              echo "No README found for $repo, skipping..."
              rm -f "$readme_file"
              continue
            fi

            temp_file=$(mktemp "$TARGET_FOLDER/.${repo}.XXXXXX")
            {
              echo '---'
              echo "title: $(jq -r '.name | @json' <<< "$repo_metadata")"
              echo "description: $(jq -r '(.description // "") | @json' <<< "$repo_metadata")"
              echo "clone_url: $(jq -r '.clone_url | @json' <<< "$repo_metadata")"
              echo "language: $(jq -r '(.language // "") | @json' <<< "$repo_metadata")"
              echo "homepage: $(jq -r '(.homepage // "") | @json' <<< "$repo_metadata")"
              echo 'topics:'
              jq -r '.topics[] | "  - " + @json' <<< "$repo_metadata"
              echo "created_at: $(jq -r '.created_at | @json' <<< "$repo_metadata")"
              echo "updated_at: $(jq -r '.updated_at | @json' <<< "$repo_metadata")"
              echo '---'
              echo
              printf '%s\n' "$readme_content"
            } > "$temp_file"
            mv "$temp_file" "$readme_file"
          done

          find "$TARGET_FOLDER" -maxdepth 1 -type f -name '*_README.mdx' -print0 \
            | while IFS= read -r -d '' existing_file; do
                if ! grep -Fxq "$existing_file" "$expected_files"; then
                  rm -f "$existing_file"
                fi
              done

      - name: Commit changes
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync showcase project content"
            git push
          else
            echo "No changes to commit."
          fi
